name: Captain Self-Improvement

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: captain-self-improvement
  cancel-in-progress: false

jobs:
  prepare-fix:
    # Captain is archived. Keep the former repair job for a reversible restore,
    # but never run it automatically or manually while the archive is in force.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture failed self-test logs
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .codex-artifacts
          gh run view "$FAILED_RUN_ID" --log-failed \
            > .codex-artifacts/captain-self-test-failure.log
          gh run download "$FAILED_RUN_ID" \
            --dir .codex-artifacts/eval-run \
            || true
      - name: Prepare a verified repair
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/captain-self-improvement.md
          output-file: .codex-artifacts/codex-report.md
          codex-args: '["--ephemeral"]'
          sandbox: workspace-write
          safety-strategy: drop-sudo
      - name: Upload investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-self-improvement-${{ github.event.workflow_run.id }}
          path: .codex-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Validate proposed repair
        run: |
          git diff --check
          pnpm --filter @agents/flight-domain test
          pnpm --filter @agents/telegram-core test
          pnpm --filter @agents/flight-store test
          pnpm --filter @agents/captain test
          pnpm --filter @agents/flight-domain typecheck
          pnpm --filter @agents/telegram-core typecheck
          pnpm --filter @agents/flight-store typecheck
          pnpm --filter @agents/captain typecheck
          pnpm --filter @agents/captain build
      - name: Create repair branch
        id: repair
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPAIR_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_WORKFLOW_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_WORKFLOW_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all | sed '/^?? \.codex-artifacts\//d')"
          if [ -z "$changes" ]; then
            rm -rf .codex-artifacts
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/write-agent-improvement-record.mjs \
            --agent captain \
            --run-id "$FAILED_RUN_ID" \
            --failed-run-url "$FAILED_RUN_URL" \
            --repair-workflow-url "$REPAIR_WORKFLOW_URL" \
            --source-workflow-conclusion "$SOURCE_WORKFLOW_CONCLUSION" \
            --source-workflow-started-at "$SOURCE_WORKFLOW_STARTED_AT" \
            --source-workflow-completed-at "$SOURCE_WORKFLOW_COMPLETED_AT" \
            --report .codex-artifacts/codex-report.md \
            --output-dir apps/captain/agent-improvements
          rm -rf .codex-artifacts
          branch="codex/captain-self-improve-${FAILED_RUN_ID}"
          git config user.name "Captain Self-Improvement"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Prepare Captain regression fix"
          gh auth setup-git
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open repair pull request
        if: steps.repair.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ steps.repair.outputs.branch }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh pr create \
            --base main \
            --head "$REPAIR_BRANCH" \
            --title "Captain: repair failed daily self-test" \
            --body "Prepared automatically from a failed Captain synthetic test.\n\nFailed run: ${FAILED_RUN_URL}\n\nThe repair job added regression coverage and passed the Captain validation gate. Review is required before merge."
