name: Captain CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/captain/**
      - packages/flight-domain/**
      - packages/flight-store/**
      - packages/observability/**
      - packages/telegram-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/codex/prompts/captain-self-improvement.md
      - .github/workflows/captain-ci.yml
      - .github/workflows/captain-hourly-self-test.yml
      - .github/workflows/captain-self-improvement.yml
      - .github/workflows/deploy-captain.yml
  push:
    branches: [main]
    paths:
      - apps/captain/**
      - packages/flight-domain/**
      - packages/flight-store/**
      - packages/observability/**
      - packages/telegram-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/codex/prompts/captain-self-improvement.md
      - .github/workflows/captain-ci.yml
      - .github/workflows/captain-hourly-self-test.yml
      - .github/workflows/captain-self-improvement.yml
      - .github/workflows/deploy-captain.yml

permissions:
  contents: read

concurrency:
  group: captain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: captain_conformance
          POSTGRES_PASSWORD: captain_test
          POSTGRES_USER: captain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captain -d captain_conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Opts the store conformance suite into its Postgres run. Without this
      # the suite only exercises the in-memory twin, which is how the two
      # implementations were able to drift.
      CAPTAIN_TEST_DATABASE_URL: postgresql://captain:captain_test@127.0.0.1:5432/captain_conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the Captain schema into the conformance database
        run: pnpm --filter @agents/captain db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://captain:captain_test@127.0.0.1:5432/captain_conformance
          CAPTAIN_ALLOW_BASELINE: "1"
      # `pnpm check` runs the boundary guard and every workspace package's
      # test, typecheck, and build. Enumerating packages here instead let
      # flight-worker and the provider adapters fall out of CI unnoticed.
      - run: pnpm check
