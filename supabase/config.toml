project_id = "captain"

[auth]
site_url = "https://captain.example.com/admin"
additional_redirect_urls = [
  "https://captain.example.com/admin",
  "http://127.0.0.1:4178/admin",
]
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
