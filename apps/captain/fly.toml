app = "dr-captain"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node scripts/release.mjs"

[env]
  AI_MODEL = "anthropic/claude-sonnet-5"
  TRIP_INTERPRETER_MODEL = "openai/gpt-5.6-luna"
  PORT = "8080"
  CAPTAIN_PUBLIC_URL = "https://dr-captain.fly.dev"
  CAPTAIN_PUBLIC_BETA_ENABLED = "true"
  CAPTAIN_BETA_USER_LIMIT = "25"
  WORKFLOW_POSTGRES_JOB_PREFIX = "captain_eve"
  GRAPHILE_WORKER_SCHEMA = "captain_worker"
  WORKFLOW_POSTGRES_WORKER_CONCURRENCY = "4"
  WORKFLOW_POSTGRES_MAX_POOL_SIZE = "8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "12s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    timeout = "6s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
